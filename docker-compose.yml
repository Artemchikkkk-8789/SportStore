services:
  postgres:
    image: postgres:16
    container_name: sportstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportstore
      POSTGRES_USER: sportstore
      POSTGRES_PASSWORD: sportstore123
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
